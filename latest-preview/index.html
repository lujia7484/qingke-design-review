<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青稞网站 · 静态评审</title><style>body{margin:0;background:#f3f4f6;color:#202329;font-family:system-ui,'Microsoft YaHei',sans-serif}header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e6e8ec;padding:14px 20px}h1{font-size:18px;margin:0 0 8px}p{font-size:13px;color:#687180;margin:0 0 10px}nav{display:flex;gap:7px;overflow:auto}button{white-space:nowrap;border:1px solid #e3e7ed;border-radius:8px;background:#fff;padding:8px 13px;cursor:pointer}button.active{background:#006ce0;color:white;border-color:#006ce0}main{max-width:1440px;margin:18px auto;background:white}img{display:block;width:100%;height:auto} </style></head><body><header><h1>青稞网站 · 页面评审</h1><p>当前页面的静态截图，仅供查看设计；截图中的按钮不可操作，内容不会自动更新。</p><nav id="nav"></nav></header><main><img id="page" alt="青稞网站首页截图"></main><script>const pages=[['home','首页'],['about','认识青稞'],['courses','课程学习'],['articles','青稞书房'],['shop','产品中心'],['teachers','认识老师'],['assessments','心理测评'],['events','活动日历']];const nav=document.querySelector('#nav'),image=document.querySelector('#page');function select(id){const item=pages.find(x=>x[0]===id)||pages[0];image.src=item[0]+'.png';image.alt='青稞网站'+item[1]+'截图';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===item[0]));}for(const [id,name] of pages){const b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.onclick=()=>{select(id);window.scrollTo(0,0)};nav.appendChild(b)}select('home');</script></body></html>
